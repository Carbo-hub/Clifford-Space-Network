[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clifford-space-network"
version = "1.0.0"
description = "Clifford Space Networks (CSN): Geometric Deep Learning via Spin Groups and Associative Scans"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "CSN Research Team"}
]
dependencies = [
    "torch>=2.2.0",
    "numpy>=1.24.0"
]

[project.optional-dependencies]
vision = [
    "torchvision>=0.17.0",
    "opencv-python-headless>=4.8.0"
]
dev = [
    "pytest>=7.0.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["csn*"]
